server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${oit.datasource.driver-class-name}
      url: jdbc:mysql://${oit.datasource.host}:${oit.datasource.port}/${oit.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${oit.datasource.username}
      password: ${oit.datasource.password}
  redis:
    host: ${oit.redis.host}
    port: ${oit.redis.port}

mybatis:
  # Mapper 配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.oit.entity
  configuration:
    # 开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      oit:
        mapper: debug
        service: info
        controller: info

oit:
  jwt:
    # 设置 jwt 签名加密时使用的秘钥
    admin-secret-key: itcast
    # 设置 jwt 过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
  alioss:
    endpoint: ${oit.alioss.endpoint}
    access-key-id: ${oit.alioss.access-key-id}
    access-key-secret: ${oit.alioss.access-key-secret}
    bucket-name: ${oit.alioss.bucket-name}